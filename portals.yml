    - "Slovakia"
    - "Slovenia"
    # Asia-Pacific / Middle East
    - "Singapore"
    - "Japan"
    - "South Korea"
    - "China"
    - "Hong Kong"
    - "Taiwan"
    - "Australia"
    - "New Zealand"
    - "Indonesia"
    - "Vietnam"
    - "Thailand"
    - "Philippines"
    - "Malaysia"
